# Auto-discovered repository actions for oakwood-commons/sln-agentic-code.
#
# Common commands:
#   scafctl run action install-tools
#   scafctl run action ci
#   scafctl run action go-ci
#   scafctl run action docs-build
#   scafctl run action docs-serve
#   scafctl run action configure-github -r owner=oakwood-commons -r repo=sln-agentic-code

apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: sln-agentic-code-repo
  version: 0.1.0
  displayName: sln-agentic-code Repository Actions
  category: workflow
  tags:
    - agentic-coding
    - hugo
    - go
    - ci
  description: |
    Cross-platform tool installer, Hugo documentation builder, Go CI runner,
    solution bundle verifier, and GitHub repository configurator for
    oakwood-commons/sln-agentic-code.

bundle:
  plugins:
    - name: exec
      kind: provider
      version: latest
    - name: metadata
      kind: provider
      version: latest

spec:
  resolvers:
    platform:
      description: Runtime OS, CPU architecture, and repository root directory
      resolve:
        with:
          - provider: metadata
            inputs: {}
      validate:
        with:
          - provider: validation
            inputs:
              expression: '__self.os in ["linux", "darwin", "windows"]'
            message: "Unsupported operating system (expected linux, darwin, or windows)"
          - provider: validation
            inputs:
              expression: '__self.arch in ["amd64", "arm64"]'
            message: "Unsupported CPU architecture (expected amd64 or arm64)"

    tools_bin:
      description: Directory where missing developer tools (hugo, gh, go, golangci-lint, gosec) are installed
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: tools_bin
          - provider: cel
            inputs:
              expression: '_.platform.cwd + "/.tool/bin"'

    hugo_version:
      description: Pinned Hugo extended version (matching .github/workflows/pages.yml)
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: hugo_version
          - provider: static
            inputs:
              value: "0.155.2"

    gh_version:
      description: Pinned GitHub CLI version installed into .tool/bin when missing
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: gh_version
          - provider: static
            inputs:
              value: "2.106.0"

    owner:
      description: GitHub repository owner for configure-github
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: owner
          - provider: static
            inputs:
              value: "oakwood-commons"

    repo:
      description: GitHub repository name for configure-github
      type: string
      resolve:
        with:
          - provider: parameter
            inputs:
              key: repo
          - provider: static
            inputs:
              value: "sln-agentic-code"

    required_approvals:
      description: Required PR approvals on main for configure-github (1 for org teams, 0 for solo)
      type: int
      resolve:
        with:
          - provider: parameter
            inputs:
              key: required_approvals
          - provider: static
            inputs:
              value: 1

  workflow:
    actions:
      install-tools:
        displayName: Install Repo & CI Tools
        description: Install Hugo extended, gh, Go 1.26+, golangci-lint, and gosec across Linux, macOS, and Windows
        provider: exec
        timeout: 10m
        inputs:
          passthrough: true
          env:
            TARGET_OS:
              expr: "_.platform.os"
            TARGET_ARCH:
              expr: "_.platform.arch"
            TOOLS_BIN:
              rslvr: tools_bin
            HUGO_VERSION:
              rslvr: hugo_version
            GH_VERSION:
              rslvr: gh_version
          command: |
            set -e
            mkdir -p "$TOOLS_BIN"
            PATH_SEP=":"
            if [ "$TARGET_OS" = "windows" ]; then
              PATH_SEP=";"
            fi
            export PATH="${TOOLS_BIN}${PATH_SEP}${PATH}"

            NL="$(printf '\nx')"
            NL="${NL%x}"
            CR="$(printf '\r')"
            HUGO_VER_OUT=""
            if command -v hugo >/dev/null 2>&1; then
              HUGO_VER_OUT="$(hugo version 2>/dev/null || true)"
            fi
            case "$HUGO_VER_OUT" in
              *"${HUGO_VERSION}"*extended*|*"${HUGO_VERSION}"*Extended*)
                echo "hugo extended v${HUGO_VERSION} already available: ${HUGO_VER_OUT}"
                ;;
              *)
                echo "Installing hugo extended v${HUGO_VERSION} for ${TARGET_OS}/${TARGET_ARCH}..."
                (
                  TMP_DIR="$(mktemp -d)"
                  trap 'rm -rf "$TMP_DIR"' EXIT
                  if [ "$TARGET_OS" = "linux" ]; then
                    ARCHIVE="hugo_extended_${HUGO_VERSION}_linux-${TARGET_ARCH}.tar.gz"
                    URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${ARCHIVE}"
                    curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                    tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
                    cp "${TMP_DIR}/hugo" "${TOOLS_BIN}/hugo"
                    chmod +x "${TOOLS_BIN}/hugo"
                  elif [ "$TARGET_OS" = "darwin" ]; then
                    ARCHIVE="hugo_extended_${HUGO_VERSION}_darwin-universal.pkg"
                    URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${ARCHIVE}"
                    curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                    pkgutil --expand-full "${TMP_DIR}/${ARCHIVE}" "${TMP_DIR}/expanded"
                    FIND_OUT="$(find "${TMP_DIR}/expanded" -name hugo -type f)"
                    HUGO_BIN="${FIND_OUT%%"$NL"*}"
                    HUGO_BIN="${HUGO_BIN%"$CR"}"
                    if [ -z "$HUGO_BIN" ]; then
                      echo "hugo binary not found inside expanded macOS pkg" >&2
                      exit 1
                    fi
                    cp "$HUGO_BIN" "${TOOLS_BIN}/hugo"
                    chmod +x "${TOOLS_BIN}/hugo"
                  elif [ "$TARGET_OS" = "windows" ]; then
                    ARCHIVE="hugo_extended_${HUGO_VERSION}_windows-amd64.zip"
                    URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${ARCHIVE}"
                    curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                    if command -v tar.exe >/dev/null 2>&1; then
                      tar.exe -xf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
                    else
                      ARCHIVE_PATH="${TMP_DIR}/${ARCHIVE}" DEST_DIR="$TMP_DIR" powershell.exe -NoProfile -Command 'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DEST_DIR -Force'
                    fi
                    cp "${TMP_DIR}/hugo.exe" "${TOOLS_BIN}/hugo.exe"
                  fi
                )
                ;;
            esac

            if command -v gh >/dev/null 2>&1; then
              GH_VER_RAW="$(gh --version 2>/dev/null || true)"
              GH_FIRST_LINE="${GH_VER_RAW%%"$NL"*}"
              GH_FIRST_LINE="${GH_FIRST_LINE%"$CR"}"
              echo "gh CLI already available: ${GH_FIRST_LINE}"
            else
              echo "Installing GitHub CLI v${GH_VERSION} for ${TARGET_OS}/${TARGET_ARCH}..."
              (
                TMP_DIR="$(mktemp -d)"
                trap 'rm -rf "$TMP_DIR"' EXIT
                if [ "$TARGET_OS" = "linux" ]; then
                  ARCHIVE="gh_${GH_VERSION}_linux_${TARGET_ARCH}.tar.gz"
                  URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/${ARCHIVE}"
                  curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                  tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
                  cp "${TMP_DIR}/gh_${GH_VERSION}_linux_${TARGET_ARCH}/bin/gh" "${TOOLS_BIN}/gh"
                  chmod +x "${TOOLS_BIN}/gh"
                elif [ "$TARGET_OS" = "darwin" ]; then
                  ARCHIVE="gh_${GH_VERSION}_macOS_${TARGET_ARCH}.zip"
                  URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/${ARCHIVE}"
                  curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                  unzip -q "${TMP_DIR}/${ARCHIVE}" -d "$TMP_DIR"
                  cp "${TMP_DIR}/gh_${GH_VERSION}_macOS_${TARGET_ARCH}/bin/gh" "${TOOLS_BIN}/gh"
                  chmod +x "${TOOLS_BIN}/gh"
                elif [ "$TARGET_OS" = "windows" ]; then
                  ARCHIVE="gh_${GH_VERSION}_windows_${TARGET_ARCH}.zip"
                  URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/${ARCHIVE}"
                  curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
                  if command -v tar.exe >/dev/null 2>&1; then
                    tar.exe -xf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
                  else
                    ARCHIVE_PATH="${TMP_DIR}/${ARCHIVE}" DEST_DIR="$TMP_DIR" powershell.exe -NoProfile -Command 'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DEST_DIR -Force'
                  fi
                  FIND_GH="$(find "$TMP_DIR" -name "gh.exe" -type f)"
                  GH_BIN="${FIND_GH%%"$NL"*}"
                  GH_BIN="${GH_BIN%"$CR"}"
                  if [ -z "$GH_BIN" ]; then
                    echo "gh.exe not found inside extracted archive" >&2
                    exit 1
                  fi
                  cp "$GH_BIN" "${TOOLS_BIN}/gh.exe"
                fi
              )
            fi

            scafctl run action install-tools -f ./ci/go-ci/actions.yaml -r "tools_bin=${TOOLS_BIN}"

      go-ci:
        displayName: Go Sample App CI
        description: Run the portable Go CI workflow against examples/go-app and check repo readiness
        provider: exec
        dependsOn:
          - install-tools
        timeout: 10m
        inputs:
          passthrough: true
          env:
            TARGET_OS:
              expr: "_.platform.os"
            TOOLS_BIN:
              rslvr: tools_bin
          command: |
            set -e
            EXE_EXT=""
            if [ "$TARGET_OS" = "windows" ]; then
              EXE_EXT=".exe"
            fi
            scafctl run action ci -f ./ci/go-ci/actions.yaml \
              -r workdir=examples/go-app \
              -r "tools_bin=${TOOLS_BIN}" \
              -r build_pkg=./cmd/shorty \
              -r "output_bin=../../dist/shorty${EXE_EXT}"
            "./dist/shorty${EXE_EXT}" -h

      lint-solutions:
        displayName: Lint & Bundle-Check scafctl Solutions
        description: Validate all scafctl solution/action YAML files and verify scafctl/solution.yaml bundle integrity
        provider: exec
        timeout: 3m
        inputs:
          passthrough: true
          command: |
            set -e
            scafctl lint -f ./actions.yaml
            scafctl lint -f ./ci/go-ci/actions.yaml
            scafctl lint -f ./scafctl/solution.yaml
            if [ "$(cat ./ci/go-ci/actions.yaml)" != "$(cat ./scafctl/go-ci/actions.yaml)" ]; then
              echo "ci/go-ci/actions.yaml and scafctl/go-ci/actions.yaml are out of sync" >&2
              exit 1
            fi
            TMP_TREE="$(mktemp)"
            trap 'rm -f "$TMP_TREE"' EXIT
            scafctl run resolver opencode_files -f ./scafctl/solution.yaml -o tree --no-color > "$TMP_TREE"
            if [ ! -f ./layouts/_partials/opencode-tree.txt ] || [ "$(cat "$TMP_TREE")" != "$(cat ./layouts/_partials/opencode-tree.txt)" ]; then
              echo "layouts/_partials/opencode-tree.txt is out of sync (run 'scafctl run action docs-serve' or update layouts/_partials/opencode-tree.txt)" >&2
              exit 1
            fi
            SKILLS_DOC="./docs/reference/skills-and-agents.md"
            SKILLS_CONTENT="$(cat "$SKILLS_DOC")"
            for f in ./scafctl/user-opencode/skills/*/SKILL.md ./scafctl/user-opencode/skills/*/*.md ./scafctl/user-opencode/agents/*.md ./scafctl/user-opencode/commands/*.md ./scafctl/user-opencode/instructions/*.md; do
              REL="${f#./scafctl/user-opencode/}"
              case "$SKILLS_CONTENT" in
                *"path=\"${REL}\""*) ;;
                *)
                  echo "${SKILLS_DOC} is missing a starter-drawer entry for bundled file: ${REL}" >&2
                  exit 1
                  ;;
              esac
            done
            scafctl package solution -f ./scafctl/solution.yaml --dry-run --skip-tests --no-vendor

      test-solutions:
        displayName: Functional Tests (scafctl)
        description: Run scafctl functional test suites across repository solutions
        provider: exec
        dependsOn:
          - lint-solutions
        timeout: 5m
        inputs:
          passthrough: true
          command: |
            set -e
            scafctl test functional -f ./actions.yaml
            scafctl test functional -f ./ci/go-ci/actions.yaml
            scafctl test functional -f ./scafctl/solution.yaml

      docs-build:
        displayName: Build Hugo Docs
        description: Build the Hugo documentation site into ./public with minification
        provider: exec
        dependsOn:
          - install-tools
          - lint-solutions
        timeout: 5m
        inputs:
          passthrough: true
          env:
            TARGET_OS:
              expr: "_.platform.os"
            TOOLS_BIN:
              rslvr: tools_bin
            HUGO_ENVIRONMENT: production
          command: |
            set -e
            PATH_SEP=":"
            if [ "$TARGET_OS" = "windows" ]; then
              PATH_SEP=";"
            fi
            export PATH="${TOOLS_BIN}${PATH_SEP}${PATH}"
            if [ -f ./site/hugo.yaml ]; then
              cd site
              hugo --gc --minify
            else
              echo "site/hugo.yaml not yet scaffolded; skipping hugo build."
            fi

      docs-serve:
        displayName: Serve Hugo Docs Locally
        description: Start a live-reloading Hugo server at http://localhost:1313
        explicit: true
        provider: exec
        timeout: 24h
        dependsOn:
          - install-tools
        inputs:
          passthrough: true
          env:
            TARGET_OS:
              expr: "_.platform.os"
            TOOLS_BIN:
              rslvr: tools_bin
          command: |
            set -e
            PATH_SEP=":"
            if [ "$TARGET_OS" = "windows" ]; then
              PATH_SEP=";"
            fi
            export PATH="${TOOLS_BIN}${PATH_SEP}${PATH}"
            TMP_TREE="$(mktemp)"
            trap 'rm -f "$TMP_TREE"' EXIT
            scafctl run resolver opencode_files -f ./scafctl/solution.yaml -o tree --no-color > "$TMP_TREE"
            if [ ! -f ./layouts/_partials/opencode-tree.txt ] || [ "$(cat "$TMP_TREE")" != "$(cat ./layouts/_partials/opencode-tree.txt)" ]; then
              cp "$TMP_TREE" ./layouts/_partials/opencode-tree.txt
              chmod 0644 ./layouts/_partials/opencode-tree.txt
            fi
            rm -f "$TMP_TREE"
            cd site
            hugo server -D --renderToMemory --disableFastRender

      configure-github:
        displayName: Configure GitHub Repository Settings
        description: Apply preferred oakwood-commons merge, DCO, signed-commit, Copilot review, and Pages rulesets
        explicit: true
        provider: exec
        timeout: 3m
        inputs:
          passthrough: true
          env:
            GH_OWNER:
              rslvr: owner
            GH_REPO:
              rslvr: repo
            REQ_APPROVALS:
              expr: "string(_.required_approvals)"
          command: |
            scafctl run solution -f ./scafctl/solution.yaml \
              --action configure-github \
              -r "owner=${GH_OWNER}" \
              -r "repo=${GH_REPO}" \
              -r "required_approvals=${REQ_APPROVALS}" \
              -r enable_pages=true

      ci:
        displayName: Full Repository CI
        description: Run Go CI, scafctl lint/functional tests, and Hugo static site build
        provider: static
        dependsOn:
          - go-ci
          - test-solutions
          - docs-build
        inputs:
          value:
            status: passed

  testing:
    cases:
      resolve-repo-defaults:
        description: Verify repository action resolvers populate expected defaults
        command: [run, resolver]
        args: [-o, json]
        exitCode: 0
        assertions:
          - expression: '__output.owner == "oakwood-commons"'
            message: Default owner should be oakwood-commons
          - expression: '__output.repo == "sln-agentic-code"'
            message: Default repo should be sln-agentic-code
          - expression: '__output.hugo_version == "0.155.2"'
            message: Default Hugo version should be 0.155.2
          - expression: '__output.gh_version == "2.106.0"'
            message: Default GitHub CLI version should be 2.106.0
