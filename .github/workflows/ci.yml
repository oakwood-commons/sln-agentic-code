name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Go App, scafctl Solutions & Hugo Docs
    runs-on: ubuntu-latest
    env:
      SCAFCTL_VERSION: "0.47.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/go-app/go.mod
          cache: true
          cache-dependency-path: site/go.sum

      - name: Cache scafctl & repo tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tool/bin
          key: repo-tools-${{ runner.os }}-${{ runner.arch }}-scafctl-${{ env.SCAFCTL_VERSION }}-${{ hashFiles('actions.yaml', 'ci/go-ci/actions.yaml') }}

      - name: Install scafctl
        run: |
          set -euo pipefail
          TOOLS_BIN="${GITHUB_WORKSPACE}/.tool/bin"
          mkdir -p "$TOOLS_BIN"
          echo "$TOOLS_BIN" >> "$GITHUB_PATH"

          case "${RUNNER_ARCH}" in
            X64) SCAFCTL_ARCH="x86_64" ;;
            ARM64) SCAFCTL_ARCH="arm64" ;;
            *) echo "Unsupported RUNNER_ARCH: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac

          if [ "${RUNNER_OS}" = "Windows" ]; then
            BIN_NAME="scafctl.exe"
            ARCHIVE="scafctl_${SCAFCTL_VERSION}_Windows_${SCAFCTL_ARCH}.zip"
          else
            BIN_NAME="scafctl"
            ARCHIVE="scafctl_${SCAFCTL_VERSION}_${RUNNER_OS}_${SCAFCTL_ARCH}.tar.gz"
          fi

          if [ ! -x "${TOOLS_BIN}/${BIN_NAME}" ]; then
            URL="https://github.com/oakwood-commons/scafctl/releases/download/v${SCAFCTL_VERSION}/${ARCHIVE}"
            (
              TMP_DIR="$(mktemp -d)"
              trap 'rm -rf "$TMP_DIR"' EXIT
              curl -fsSL "$URL" -o "${TMP_DIR}/${ARCHIVE}"
              if [ "${RUNNER_OS}" = "Windows" ]; then
                tar.exe -xf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
              else
                tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "$TMP_DIR"
              fi
              cp "${TMP_DIR}/${BIN_NAME}" "${TOOLS_BIN}/${BIN_NAME}"
              chmod +x "${TOOLS_BIN}/${BIN_NAME}"
            )
          fi

      - name: Run full repository CI via scafctl
        run: scafctl run action ci
