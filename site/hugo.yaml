# Hugo Configuration for oakwood-commons/sln-agentic-code
# Hugo runs from site/ so its theme go.mod stays isolated from Go code in examples/.

baseURL: "https://oakwood-commons.github.io/sln-agentic-code/"
languageCode: "en-us"
title: "Agentic Code & scafctl"
enableRobotsTXT: true

publishDir: "../public"

module:
  imports:
    - path: github.com/alex-shpak/hugo-book
  mounts:
    - source: ../docs
      target: content/docs
    - source: ../home
      target: content
    - source: ../assets
      target: assets
    - source: ../layouts
      target: layouts
    - source: ../static
      target: static

params:
  description: "Disciplined agentic software engineering in Go with OpenCode, GitHub Copilot Code Review, and oakwood-commons/scafctl"
  github_repo: "https://github.com/oakwood-commons/sln-agentic-code"
  github_project_repo: "https://github.com/oakwood-commons/sln-agentic-code"

  BookTheme: "blueprint"
  BookLogo: "images/symbol.svg"
  BookFavicon: "favicon.png"
  BookSection: docs
  BookRepo: "https://github.com/oakwood-commons/sln-agentic-code"
  BookEditLink: 'https://github.com/oakwood-commons/sln-agentic-code/edit/main/{{ $p := replace .Page.File.Path "\\" "/" }}{{ if eq $p "_index.md" }}home/_index.md{{ else }}{{ $p }}{{ end }}'
  BookDateFormat: "January 2, 2006"
  BookSearch: true
  BookComments: false
  BookToC: true

markup:
  highlight:
    style: github-dark
    lineNos: false
    codeFences: true
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true

menu:
  before: []
  after:
    - name: "GitHub Repository"
      url: "https://github.com/oakwood-commons/sln-agentic-code"
      weight: 10
    - name: "scafctl Docs"
      url: "https://oakwood-commons.github.io/scafctl/"
      weight: 20
